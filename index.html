<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Une application Todo simple pour organiser ses tâches quotidiennes.">
  <title>My Todo List</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <p class="eyebrow">ORGANISE TON QUOTIDIEN</p>
      <h1>My Todo List <span aria-hidden="true">✦</span></h1>
      <p class="subtitle">Une petite étape à la fois. Tu peux le faire !</p>
    </header>

    <section class="panel" aria-labelledby="add-heading">
      <h2 id="add-heading">Ajouter une tâche</h2>
      <form id="task-form">
        <label class="sr-only" for="task-input">Nouvelle tâche</label>
        <input id="task-input" name="task" type="text" maxlength="160"
               placeholder="Ex. Réviser mon cours de JavaScript…" autocomplete="off" required>
        <button type="submit" class="add-button">Ajouter <span aria-hidden="true">+</span></button>
      </form>
      <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
    </section>

    <section class="summary" aria-label="Résumé des tâches">
      <div class="summary-card">
        <span class="summary-label">Toutes les tâches</span>
        <strong id="total-count">0</strong>
      </div>
      <div class="summary-card">
        <span class="summary-label">Terminées</span>
        <strong id="completed-count">0</strong>
      </div>
      <div class="summary-card">
        <span class="summary-label">À faire</span>
        <strong id="remaining-count">0</strong>
      </div>
    </section>

    <section class="panel task-panel" aria-labelledby="tasks-heading">
      <div class="list-heading">
        <div>
          <p class="eyebrow">TA LISTE</p>
          <h2 id="tasks-heading">Mes tâches</h2>
        </div>
        <button id="clear-completed" class="text-button" type="button">Effacer les terminées</button>
      </div>
      <ul id="task-list" class="task-list" aria-live="polite"></ul>
      <div id="empty-state" class="empty-state">
        <span class="empty-icon" aria-hidden="true">✧</span>
        <p><strong>Tout commence ici.</strong></p>
        <p>Ajoute ta première tâche ci-dessus.</p>
      </div>
    </section>

    <footer>
      <p>Enregistré automatiquement sur cet appareil · <span id="current-year"></span></p>
    </footer>
  </main>
</body>
</html>
